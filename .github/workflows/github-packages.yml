name: Publish GitHub Packages
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta semántica aprobada
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: github-packages-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - run: pnpm install --frozen-lockfile
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/check-release.mjs
      - run: pnpm verify
      - run: node scripts/generate-example.mjs --check
      - run: node scripts/prepare-github-package.mjs "$RUNNER_TEMP/archkit-github-package"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@santy401'
      - name: Publish scoped distribution
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish "$RUNNER_TEMP/archkit-github-package" --registry=https://npm.pkg.github.com --access public --provenance=false --ignore-scripts
