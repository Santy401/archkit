name: Prepare draft GitHub Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta existente y aprobada
        required: true
        default: v0.1.0
        type: string
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: npm pack --ignore-scripts
      - name: Create a draft for manual review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" create-archkit-*.tgz --verify-tag --draft --title "ArchKit $RELEASE_TAG" --notes-file docs/releases/0.1.0.md
